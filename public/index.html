<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>shape</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
    <svg id="board" tabindex="0" aria-label="Whiteboard">
        <defs>
            <pattern id="grid-small" width="20" height="20" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r="1" fill="#d8dee4"></circle>
            </pattern>
        </defs>
        <rect id="grid" width="100%" height="100%" fill="url(#grid-small)"></rect>
        <g id="world">
            <g id="scene"></g>
            <g id="strokes"></g>
            <g id="live"></g>
            <g id="overlay"></g>
        </g>
    </svg>

    <div id="toolbar" class="panel" role="toolbar" aria-label="Tools">
        <button data-tool="select" title="Select (V)">⬚<span>V</span></button>
        <button data-tool="hand" title="Pan (H / Space)">✋<span>H</span></button>
        <div class="sep"></div>
        <button data-tool="pen" title="Draw (P)">✏️<span>P</span></button>
        <button data-tool="eraser" title="Erase sketch (E)">🧽<span>E</span></button>
        <div class="sep"></div>
        <button data-tool="rect" title="Rectangle (R)">▭<span>R</span></button>
        <button data-tool="ellipse" title="Ellipse (O)">◯<span>O</span></button>
        <button data-tool="diamond" title="Diamond (D)">◇<span>D</span></button>
        <button data-tool="arrow" title="Arrow (A)">➝<span>A</span></button>
        <button data-tool="text" title="Text (T)">T<span>T</span></button>
        <div id="pen-colors" class="swatches hidden"></div>
    </div>

    <div id="topbar" class="panel">
        <input id="title" type="text" spellcheck="false" aria-label="Title" maxlength="120">
        <div class="sep"></div>
        <button id="undo" title="Undo (Ctrl+Z)">↶</button>
        <button id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
        <button id="zoom" title="Zoom to fit (Shift+1)">100%</button>
        <div class="menu">
            <button id="export-button" title="Export">⇩ Export</button>
            <div id="export-menu" class="panel menu-list hidden">
                <button data-export="png">PNG</button>
                <button data-export="svg">SVG</button>
                <button data-export="mermaid">Mermaid</button>
                <button data-export="json">JSON</button>
            </div>
        </div>
    </div>

    <div id="props" class="panel hidden">
        <label id="prop-type-row">Shape
            <select id="prop-type">
                <option value="rect">Rectangle</option>
                <option value="rounded">Rounded rectangle</option>
                <option value="ellipse">Ellipse</option>
                <option value="diamond">Diamond</option>
                <option value="cylinder">Cylinder (DB)</option>
                <option value="text">Text</option>
                <option value="frame">Group frame</option>
                <option value="azure-service">Azure service</option>
            </select>
        </label>
        <label id="prop-service-row" class="hidden">Service
            <select id="prop-service" aria-label="Azure service"></select>
        </label>
        <div class="row"><span>Stroke</span><div id="prop-stroke" class="swatches"></div></div>
        <div class="row" id="prop-fill-row"><span>Fill</span><div id="prop-fill" class="swatches"></div></div>
        <label class="check"><input id="prop-dashed" type="checkbox"> Dashed</label>
        <label id="prop-head-row">Arrowhead
            <select id="prop-head">
                <option value="end">→</option>
                <option value="both">↔</option>
                <option value="start">←</option>
                <option value="none">—</option>
            </select>
        </label>
        <label id="prop-route-row">Route
            <select id="prop-route">
                <option value="straight">Straight</option>
                <option value="elbow">Elbow</option>
            </select>
        </label>
        <button id="prop-delete" class="danger">Delete</button>
    </div>

    <div id="refine" class="panel">
        <input id="instruction" type="text" placeholder="Optional AI instruction, e.g. Add a DB and use a 3-tier layout" maxlength="2000">
        <button id="refine-button" class="primary" title="Refine the sketch with AI (Ctrl+Enter)">✨ Finish</button>
        <span id="refine-status"></span>
    </div>

    <div id="empty" class="hidden">
        <p>✏️ Draw rough boxes and arrows with the pen (P), then press <b>✨ Finish</b> to turn them into an editable diagram.</p>
        <p class="sub">You can also add shapes directly with R / O / D / A / T. Double-click to edit a label.</p>
    </div>

    <textarea id="editor" class="hidden" spellcheck="false"></textarea>
    <div id="toasts"></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
